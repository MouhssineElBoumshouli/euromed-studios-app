name: Live demo check

# Runs the two-device demo against the live demo database, using the web
# build saved on the "preview" branch. Start it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Preview folder to test (branch name with / replaced by -)
        required: true
        default: feat-6-approvals

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the web build
        run: |
          git fetch origin preview --depth 1
          git archive FETCH_HEAD "${{ inputs.slug }}" | tar -x
          mv "${{ inputs.slug }}" site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Serve the app
        run: (cd site && python3 -m http.server 8080 &) && sleep 2
      - name: Run the live demo
        run: node e2e/live_demo.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-demo-screens
          path: e2e/out
