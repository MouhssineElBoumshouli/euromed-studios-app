name: App CI

# Runs on every push and pull request that touches the app.
# GitHub's machines install Flutter, check the code, run the tests,
# and build the web preview.

on:
  push:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Add missing platform files (web)
        run: flutter create --platforms=web --project-name euromed_studios --org ma.ueuromed . --no-overwrite

      - name: Get packages
        run: flutter pub get

      - name: Format code (auto-fix on branches)
        run: |
          dart format lib test
          if [ -n "$(git status --porcelain lib test)" ]; then
            echo "Formatting changed files:"; git status --porcelain lib test
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add lib test && git commit -m "style: dart format" && git push
            fi
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

      - name: Build web preview
        run: |
          flutter build web --release --base-href /
          # Make the preview work from any folder, not only the site root.
          sed -i 's#<base href="/">#<base href="./">#' build/web/index.html

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: app/build/web
          retention-days: 14
