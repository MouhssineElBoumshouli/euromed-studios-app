name: App CI

# Runs on every push and pull request that touches the app.
# GitHub's machines install Flutter, check the code, run the tests,
# and build the web preview.

on:
  push:
    paths: ["app/**", "e2e/**", "supabase/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", "e2e/**", "supabase/**", ".github/workflows/app-ci.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Add missing platform files (web, Android, iOS)
        run: flutter create --platforms=web,android,ios --project-name euromed_studios --org ma.ueuromed . --no-overwrite

      - name: Save new platform files (one-time, on branches)
        if: github.event_name == 'push' && github.ref_name != 'main'
        run: |
          if [ -n "$(git status --porcelain android ios)" ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android ios && git commit -m "chore: add Android and iOS platform files"
            git pull --rebase --autostash -q origin "${{ github.ref_name }}" && git push || echo "Could not save platform files."
          fi

      - name: Get packages
        run: flutter pub get

      - name: Format code (auto-fix on branches)
        run: |
          dart format lib test
          if [ -n "$(git status --porcelain lib test)" ]; then
            echo "Formatting changed files:"; git status --porcelain lib test
            if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "main" ]; then
              git config --global user.name "github-actions[bot]"
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add lib test && git commit -m "style: dart format"
              git pull --rebase -q origin "${{ github.ref_name }}" && git push || echo "Could not save formatting (branch moved); continuing."
            fi
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test --reporter expanded

      - name: Build web preview
        run: |
          flutter build web --release --base-href / --no-web-resources-cdn
          # Make the preview work from any folder, not only the site root.
          sed -i 's#<base href="/">#<base href="./">#' build/web/index.html

      - name: Save preview to the "preview" branch
        if: github.event_name == 'push'
        working-directory: .
        run: |
          set -e
          SLUG=$(echo "${{ github.ref_name }}" | tr '/' '-')
          # The main version is the permanent demo link: .../euromed-studios-app/demo/
          if [ "$SLUG" = "main" ]; then SLUG=demo; fi
          rm -rf /tmp/pv && mkdir -p /tmp/pv
          cp -r app/build/web /tmp/pv/site
          find /tmp/pv/site -name '*.symbols' -delete
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin preview:preview 2>/dev/null || true
          if git show-ref --quiet refs/heads/preview; then
            git worktree add /tmp/pvwt preview
          else
            git worktree add --detach /tmp/pvwt && (cd /tmp/pvwt && git checkout --orphan preview && git rm -rf . -q || true)
          fi
          rm -rf "/tmp/pvwt/$SLUG" && mkdir -p "/tmp/pvwt/$SLUG"
          cp -r /tmp/pv/site/. "/tmp/pvwt/$SLUG/"
          echo "${{ github.sha }}" > "/tmp/pvwt/$SLUG/BUILD_SHA"
          cd /tmp/pvwt && git add -A && git commit -qm "preview: $SLUG @ ${{ github.sha }}" && git push -q origin preview

      - name: Upload web preview
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: app/build/web
          retention-days: 14

  # Android app. Builds on every push to check it compiles; on main the APK
  # is also published next to the web demo:
  #   .../euromed-studios-app/demo/euromed-studios.apk
  android-apk:
    needs: check-test-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build the APK (64-bit phones and tablets)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
      - name: Publish the APK with the demo (main only)
        if: github.ref_name == 'main'
        working-directory: .
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin preview:preview
          git worktree add /tmp/pvwt preview
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk /tmp/pvwt/demo/euromed-studios.apk
          cd /tmp/pvwt && git add demo/euromed-studios.apk
          git commit -qm "apk: demo @ ${{ github.sha }}"
          for i in 1 2 3; do git push -q origin preview && break; git pull --rebase -q origin preview; done

  # iPhone build check (Mac machine). Manual only: Actions > App CI > Run
  # workflow. Gives an unsigned .ipa that a free Apple ID can sign with
  # Sideloadly (Windows) or Xcode (Mac).
  ios-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build for iPhone (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package as .ipa
        run: |
          mkdir -p Payload && cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr euromed-studios-unsigned.ipa Payload
      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: app/euromed-studios-unsigned.ipa
          retention-days: 7

  # Two-device live demo check against the demo database. Runs only when the
  # commit message contains "[e2e]", because it resets the demo data.
  live-demo:
    needs: check-test-build
    permissions:
      contents: write
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-preview
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Serve the app
        run: (cd site && python3 -m http.server 8080 &) && sleep 2
      - name: Run the live demo
        run: node e2e/live_demo.mjs
      - name: Save screenshots to the "e2e-screens" branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir /tmp/shots && cd /tmp/shots && git init -q -b e2e-screens
          cp -r "$GITHUB_WORKSPACE/e2e/out/." .
          git add -A
          git commit -qm "Live demo screenshots for ${GITHUB_SHA::7}"
          git remote add origin "$(git -C "$GITHUB_WORKSPACE" remote get-url origin)"
          git -C "$GITHUB_WORKSPACE" config --get-all http.https://github.com/.extraheader | head -1 > /tmp/h
          git -c http.https://github.com/.extraheader="$(cat /tmp/h)" push -f origin e2e-screens
          exit 0
